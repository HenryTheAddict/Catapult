name: release

# Triggered when you push a tag like `v1.0.0`. Builds the app, publishes
# stable installer filenames, and prepares the static h3nry.xyz/catapult
# update folder.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: publish github release
    runs-on: macos-26
    env:
      SCHEME: Catapult
      PROJECT: Catapult.xcodeproj

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: build Release
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -derivedDataPath build/derived \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: package installers
        id: dmg
        run: |
          set -euo pipefail
          STAGE="build/dmg-staging"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R "build/Release/Catapult.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"

          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
            "build/Release/Catapult.app/Contents/Info.plist")
          DMG="build/Catapult.dmg"
          UPSWEET="build/Catapult.upsweet"

          hdiutil create \
            -volname "Catapult" \
            -srcfolder "$STAGE" \
              -ov -format UDZO -fs HFS+ \
            "$DMG"
          ditto -c -k --zlibCompressionLevel 9 --keepParent "build/Release/Catapult.app" "$UPSWEET"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "upsweet=$UPSWEET" >> "$GITHUB_OUTPUT"

      - name: write update manifest
        env:
          VERSION: ${{ steps.dmg.outputs.version }}
        run: |
          set -euo pipefail
          CHANNEL="site/catapult"
          UPDATES="$CHANNEL/updates"
          mkdir -p "$CHANNEL/assets"
          mkdir -p "$UPDATES/assets"
          cp "${{ steps.dmg.outputs.dmg }}" "$CHANNEL/Catapult.dmg"
          cp "${{ steps.dmg.outputs.upsweet }}" "$CHANNEL/Catapult.upsweet"
          cp "${{ steps.dmg.outputs.dmg }}" "$UPDATES/Catapult.dmg"
          cp "${{ steps.dmg.outputs.upsweet }}" "$UPDATES/Catapult.upsweet"
          cp site/assets/*.svg "$CHANNEL/assets/"
          cp site/assets/*.svg "$UPDATES/assets/"
          python3 scripts/publish.py "${VERSION}" \
            --build "${GITHUB_RUN_NUMBER}" \
            --notes "Latest Catapult release for macOS." \
            --published-at "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            --manifest-only

      - name: publish github release
        id: ghr
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          name: Catapult ${{ steps.dmg.outputs.version }}
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            ${{ steps.dmg.outputs.dmg }}
            ${{ steps.dmg.outputs.upsweet }}
            site/catapult/update.json
            site/catapult/appcast.xml
          body: |
            ## catapult ${{ steps.dmg.outputs.version }}

            menu-bar yt-dlp wrapper for macOS.

            **install:** open `Catapult.dmg` and drag Catapult.app onto the Applications shortcut.
            in-app updates are served directly from GitHub Releases.

            ⚠️ this build is ad-hoc signed (no Developer ID / notarization).
            on first launch, right-click the app → Open to bypass Gatekeeper.

      - name: upload static catapult folder
        uses: actions/upload-artifact@v4
        with:
          name: catapult-static-update-channel
          path: site/catapult
          if-no-files-found: error
          retention-days: 30
