<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=../">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://h3nry.xyz/catapult/">
  <title>Catapult updates</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111317;
      --paper: #f7f1ea;
      --muted: #bcb1a6;
      --orange: #ff3b12;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      color: var(--paper);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background: linear-gradient(180deg, #1a1716, var(--bg));
    }

    main {
      width: min(560px, calc(100% - 32px));
      padding: 28px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 18px;
      background: rgba(255,255,255,.055);
      box-shadow: 0 28px 80px rgba(0,0,0,.34);
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(38px, 8vw, 70px);
      line-height: .95;
      letter-spacing: 0;
    }

    p {
      margin: 16px 0 0;
      color: var(--muted);
      line-height: 1.5;
      font-weight: 650;
    }

    a {
      display: inline-flex;
      margin-top: 20px;
      padding: 12px 15px;
      border-radius: 12px;
      color: white;
      background: var(--orange);
      font-weight: 850;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Catapult moved.</h1>
    <p>The update page now lives at <strong>https://h3nry.xyz/catapult/</strong>. The legacy manifest files in this folder still stay online for older builds.</p>
    <a href="../">Open Catapult</a>
  </main>
</body>
</html>
